[build-system]
build-backend = "hatchling.build"
requires = [
    "hatch-requirements-txt",
    "hatchling",
]

[project]
authors = [
    { name = "Mingzhe Zou", email = "zoumingzhe@outlook.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
description = "Tab completion management"
dynamic = [
    "dependencies",
    "version",
]
keywords = [
    "argcomplete",
    "argparse",
    "command-line",
    "completion",
    "tab-completion",
]
name = "xargcomplete"
requires-python = ">=3.8"

[project.license]
file = "LICENSE"

[project.readme]
content-type = "text/markdown"
file = "readme.md"

[project.scripts]
xargcomplete = "xargcomplete.command:main"

[project.urls]
Homepage = "https://github.com/bondbox/xargcomplete/"

[tool.hatch.build.targets.sdist]
exclude = [
    "xargcomplete/unittest",
]
packages = [
    "xargcomplete",
]

[tool.hatch.build.targets.wheel]
exclude = [
    "xargcomplete/unittest",
]
packages = [
    "xargcomplete",
]

[tool.hatch.metadata.hooks.requirements_txt]
files = [
    "requirements.txt",
]

[tool.hatch.version]
path = "xargcomplete/attribute.py"
